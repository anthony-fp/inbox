<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox</title>
    <style>
      /* The host's variables when Codex passes them; otherwise the pane's own colors. */
      :root {
        color-scheme: light;
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #595959);
        /* The status colors, which build.mjs writes from hooks/tones.ts. */
        /*TONES:light*/
        --needs-you: var(--amber);
        --issue: var(--amber);
        --sans: var(--font-sans, -apple-system, system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
        /* Surfaces are mixed from the host's colors, so they follow its theme. */
        --raised: color-mix(in srgb, var(--text) 9%, var(--bg));
        /* The open row: a neutral surface one step above the page, in the family of the hover fill. */
        --selected: color-mix(in srgb, var(--text) 6%, var(--bg));
        /* A closed row's age, dimmer than --muted and still 4.5:1 on the page. */
        --age: color-mix(in srgb, var(--muted) 90%, var(--bg));
        --hover: color-mix(in srgb, var(--key) 14%, transparent);
        --soft: color-mix(in oklab, var(--text) 8%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 10%, transparent);
        /* A closed row under the pointer: half --soft, so a list swept by the pointer stays quiet. */
        --row-hover: color-mix(in oklab, var(--soft) 50%, transparent);
        /* The Codex app's --transition-duration-basic with ease. The tab's script sets --move and --enter. */
        --quick: 150ms ease;
        /* Where a row's mark sits, and where its text starts. */
        --mark-x: 18px;
        --text-x: 44px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: var(--color-background-primary, #171717);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #a8a8a8);
          /*TONES:dark*/
          --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
          --selected: color-mix(in srgb, var(--text) 8%, var(--bg));
          --age: color-mix(in srgb, var(--muted) 85%, var(--bg));
          --soft: color-mix(in oklab, var(--text) 12%, transparent);
          --soft-hover: color-mix(in oklab, var(--text) 14%, transparent);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        /*TONES:dark*/
        --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
        --selected: color-mix(in srgb, var(--text) 8%, var(--bg));
        --age: color-mix(in srgb, var(--muted) 85%, var(--bg));
        --soft: color-mix(in oklab, var(--text) 12%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 14%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/20px var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
      }
      :focus-visible {
        outline: 1.5px solid var(--key);
        outline-offset: 1px;
        border-radius: 4px;
      }
      .muted {
        color: var(--muted);
      }
      .tone-needsYou {
        color: var(--needs-you);
      }
      .tone-findings {
        color: var(--findings);
      }
      .tone-prs {
        color: var(--prs);
      }
      .tone-done {
        color: var(--done);
      }
      .tone-error {
        color: var(--error);
      }
      .notice {
        padding: 10px 16px;
        overflow-wrap: anywhere;
      }
      .error-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-basis: 100%;
        margin: 4px 0 0;
        padding: 8px 12px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--error) 12%, var(--bg));
        color: var(--error);
        overflow-wrap: anywhere;
      }
      #app > .error-strip {
        margin: 12px 12px 0;
      }
      .error-strip .key {
        flex: none;
        color: var(--text);
      }

      /* Tabs: the shown one a raised panel, the others text on the background. */
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 12px 12px 0;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tab {
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--muted);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.shown {
        background: var(--raised);
        color: var(--text);
        font-weight: 600;
      }
      .tab .count {
        font-weight: 600;
        margin-left: 6px;
      }
      .status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      .status-line {
        flex-basis: 100%;
        padding: 0 4px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      main {
        display: flex;
        flex-direction: column;
        padding: 8px 0 4px;
      }
      /* Sections sit on the page. A hairline separates them, starting at the text column. */
      section {
        position: relative;
        padding: 10px 0;
      }
      section + section::before {
        content: '';
        position: absolute;
        top: 0;
        left: var(--text-x);
        right: 0;
        height: 1px;
        background: var(--soft);
      }
      .group-title {
        padding: 0 14px 6px var(--text-x);
      }
      .group-title b {
        font-weight: 600;
      }
      .group-title .count {
        color: var(--muted);
        white-space: pre;
      }

      /* A PR's block: its number, title and verdict, its actions, then its threads and checks. */
      .pr-head,
      .pr-status,
      .pr-actions,
      .pr-last {
        padding: 0 14px 0 var(--text-x);
        overflow-wrap: anywhere;
      }
      .pr-head {
        font-weight: 600;
      }
      .pr-head .num,
      .pr-head .pr-verdict {
        font-weight: 400;
      }
      .pr-actions {
        margin-top: 8px;
      }
      .pr-last {
        margin-top: 6px;
      }
      .pr-groups {
        margin-top: 12px;
      }
      /* A PR's rows sit a step in from their group's title, as the PR's sections sit under its title. */
      .pr-groups .list {
        --mark-x: 41px;
        --text-x: 67px;
      }
      .pr-groups .group-title + .list {
        margin-bottom: 6px;
      }
      .link {
        padding: 0;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: color-mix(in oklab, var(--text) 30%, transparent);
        text-underline-offset: 2px;
      }
      .link:hover {
        text-decoration-color: currentColor;
      }

      /* Rows. */
      /* Three columns: the mark, the text, and the age. */
      .row {
        display: grid;
        grid-template-columns: calc(var(--text-x) - var(--mark-x)) minmax(0, 1fr) auto;
        padding: var(--row-pad) 14px var(--row-pad) var(--mark-x);
      }
      /* An open row keeps a closed row's padding, so its line does not move as it opens. */
      .row.selected {
        background-color: var(--selected);
      }
      /* Marks center in a badge's width, so a ?, a • and a number line up. */
      .mark {
        align-self: start;
        padding-right: 8px;
        text-align: center;
        color: var(--muted);
      }
      .mark.done {
        color: var(--done);
      }
      .mark.issue {
        color: var(--issue);
      }
      .mark.opportunity {
        color: var(--done);
      }
      .mark.error {
        color: var(--error-mark);
      }
      .side {
        align-self: start;
        margin-left: 12px;
        color: var(--age);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* A closed row's last press reads before its age, cut short so a long step label cannot squeeze the title. */
      .side-label {
        display: inline-block;
        max-width: 11em;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        margin-right: 4px;
      }
      .row.collapsed:hover .side {
        color: var(--muted);
      }
      .content {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Its space above is padding, not a gap, so the row's height grows smoothly when the panel mounts. Its 2px below,
         with the row's padding, matches the space from the row's top edge to its title's text. */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 0 2px;
      }
      .content > .tight,
      .content.tight {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      /* A closed row's last action reads under its title, so it never squeezes the title. */
      .line {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
      }
      /* A closed row's title wraps to two lines, then clips. */
      .line .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .line .after {
        color: var(--muted);
      }
      .row.collapsed .line .after:not(.tone-error) {
        color: var(--age);
      }
      .row.collapsed:hover .line .after:not(.tone-error) {
        color: var(--muted);
      }
      .line .after.tone-error {
        color: var(--error);
      }
      /* Open, and while closing, the title shows in full where it stood, with the age following its last word. */
      .row.selected .line,
      .row.closing .line {
        display: block;
      }
      .row.selected .line .text,
      .row.closing .line .text {
        display: inline;
        font-weight: 600;
      }
      .row.selected .line .after,
      .row.closing .line .after {
        white-space: normal;
        font-weight: 400;
      }
      /* A PR thread or check: where it is or which workflow ran it leads the title, muted. */
      .line .lead {
        color: var(--muted);
        font-weight: 400;
      }
      .line .meta {
        display: block;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row.collapsed:not(:hover) .line .meta {
        color: var(--age);
      }
      .row.selected .line .meta {
        display: none;
      }
      .quote {
        white-space: pre-line;
      }
      .row.collapsed:hover {
        background-color: var(--row-hover);
      }
      /* After a click, rows slide under a pointer that has not moved, so nothing they bring under it lights up. */
      .still .row.collapsed:not(:active):hover {
        background-color: transparent;
      }
      .still .fold:not(:active):hover {
        color: var(--muted);
      }
      .title {
        font-weight: 600;
      }
      .title .after {
        font-weight: 400;
        color: var(--muted);
      }
      .body {
        overflow-wrap: anywhere;
      }
      .body p {
        margin: 0;
      }
      .body p + p {
        margin-top: 4px;
      }
      code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--soft);
        font-family: var(--mono);
      }
      /*
       * Actions are Codex's own pill buttons, size sm, in three levels: the one primary action is filled, the
       * others are outlined, and the follow-ups are plain text, with Dismiss last. Keys are an
       * extra, so no key text shows.
       */
      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 26px;
        padding: 3px 11px;
        border: 1px solid color-mix(in oklab, var(--text) 28%, transparent);
        border-radius: 999px;
        background: transparent;
        font-weight: 400;
        text-align: center;
        white-space: nowrap;
      }
      .key:not(:disabled):hover {
        background: var(--soft);
      }
      .key:focus-visible {
        outline-width: 2px;
        outline-offset: 2px;
        border-radius: 999px;
      }
      .key.primary {
        border-color: transparent;
        background: var(--text);
        color: var(--bg);
      }
      .key.primary:not(:disabled):hover {
        background: color-mix(in srgb, var(--text) 82%, var(--bg));
      }
      .key .icon {
        flex: none;
        width: 14px;
        height: 14px;
      }
      /* A follow-up is plain text: muted, the text color under the pointer, with no fill, border or padding. */
      .key.ghost {
        padding: 0 4px;
        border-color: transparent;
        background: none;
        color: var(--muted);
      }
      .key.ghost:not(:disabled):hover {
        background: none;
        color: var(--text);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      form {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      /* Codex's own fields: its border color, a 10px radius, and a heavier gray border on focus, not a colored ring. */
      input {
        flex: 1;
        min-width: 0;
        min-height: 28px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
        border-radius: 10px;
        padding: 4px 10px;
      }
      input::placeholder {
        color: var(--muted);
      }
      /* The radius again, since :focus-visible sets 4px. */
      input:focus,
      textarea:focus {
        outline: none;
        border-color: color-mix(in oklab, var(--text) 32%, transparent);
        border-radius: 10px;
      }
      textarea {
        width: 100%;
        font: 12px var(--mono);
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
        border-radius: 10px;
      }

      /*
       * Holds a group's empty line and fold, so its height can move as one. Its content sits at its bottom, so while it
       * grows, a fold already shown stays in view and the empty line slides in above it.
       */
      .group-end {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      /* Keeps the fold's margin inside, so its height is the whole end's content height. */
      .group-end-content {
        display: flow-root;
        position: relative;
      }
      /* A group's line in place of its rows while it has none open, where a row's text would start. */
      .group-empty {
        padding: var(--row-pad) 14px var(--row-pad) var(--text-x);
        color: var(--muted);
      }
      /*
       * A leaving empty line takes no height and stays where it was, above the fold, while the group's end shrinks
       * and clips it from the top as rows grow in over it.
       */
      .group-empty.leaving {
        position: absolute;
        inset: auto 0 100% 0;
        pointer-events: none;
        animation: fade-out var(--enter) forwards;
      }
      @keyframes fade-out {
        to {
          opacity: 0;
        }
      }
      /* The chevron centers in the mark column and the label starts at the rows' text, as a group's rows do. */
      .fold {
        display: block;
        margin: 8px 0 0 calc(var(--mark-x) - 1px);
        padding: 1px 4px;
        border-radius: 5px;
        color: var(--muted);
      }
      .fold:hover {
        color: var(--text);
      }
      .fold .icon {
        width: 12px;
        height: 12px;
        margin-right: calc(var(--text-x) - var(--mark-x) - 15px);
        vertical-align: -1px;
      }
      /* The closed items' marks sit under the fold's label. */
      .closed-list {
        --mark-x: 41px;
        --text-x: 67px;
      }
      /* The gap above a Closed list's rows is content, not padding, so the list opens from and closes to 0. */
      .closed-list::before {
        content: '';
        display: block;
        height: 4px;
      }
      .closed-list .row {
        padding-top: calc(var(--row-pad) / 2);
        padding-bottom: calc(var(--row-pad) / 2);
      }
      /* A closed item's outcome stays quieter than any open row. */
      .outcome {
        color: var(--age);
      }
      .settled-head {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      /* A row that settles while open fades its fill out as its height shrinks over the panel. */
      .row.settled.was-open {
        transition: background-color var(--move);
        @starting-style {
          background-color: var(--selected);
        }
      }
      /* The title and its outcome wrap, so neither is cut in the middle. */
      .settled-line {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .settled .outcome-label {
        color: var(--muted);
      }
      /* Undo's fill is the time it has left. The pill keeps the line's height, so the row does not grow. */
      .key.undo {
        flex: none;
        border-color: transparent;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        margin: -3px 0 -3px 12px;
        background: color-mix(in oklab, var(--soft) 45%, transparent);
      }
      /* While an Undo press is out, its label and arrow dim and the arrow turns. The label stays, so the pill keeps its width and the line its wrap. */
      .key.undo.undoing {
        color: var(--muted);
      }
      .key.undo.undoing .icon {
        animation: undo-turn 900ms linear infinite;
      }
      @keyframes undo-turn {
        to {
          transform: rotate(-360deg);
        }
      }
      .time-left {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--soft);
        transform-origin: left;
        animation-name: empty;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      .key.undo:not(:disabled):hover .time-left {
        background: var(--soft-hover);
      }
      .time-left.paused {
        animation-play-state: paused;
      }
      @keyframes empty {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      /* The page is at least the pane's height. The footer sits at its bottom, and an empty tab's text fills the space above it. */
      #app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .empty .title {
        margin-bottom: 4px;
      }
      footer {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 8px 16px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .demo-toggle {
        padding: 0 6px;
        border-radius: 5px;
        color: var(--muted);
      }
      .demo-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      /* One line: the notice, with Hide demo at the right. */
      .demo-note {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 8px 12px 0;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .demo-note .key {
        flex: none;
        padding: 0;
      }
      .demo-note span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .earlier {
        padding: 2px 14px 2px var(--text-x);
      }
      /*
       * Motion, with the Codex app's own timing, only for what enters or leaves. Hover, press and
       * selection fills change at once. What a draw mounts fades in from @starting-style, and heights
       * move in the script, around each draw. A row's own parts do not fade: a row that settles or is
       * undone swaps them in place, where a fade from nothing reads as a flicker.
       */
      /* The new-row bar fades out. */
      .row {
        transition: box-shadow var(--enter);
      }
      /* A panel does not fade: it stays opaque, clipped by its row's height, so a row closing and the row
         opening in its place move as one. */
      .status-line,
      .demo-note,
      .empty,
      main,
      form {
        transition: opacity var(--quick);
        @starting-style {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
        }
        /* With no motion, Undo stays full and does not count down, and its arrow does not turn. */
        .time-left,
        .key.undo.undoing .icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /*TAB_SCRIPT*/
    </script>
  </body>
</html>
