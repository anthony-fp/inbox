<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox</title>
    <style>
      /* The host's variables when Codex passes them; otherwise the pane's own colors. */
      :root {
        color-scheme: light;
        --bg: var(--color-background-primary, #ffffff);
        --text: var(--color-text-primary, #1f1f1f);
        --muted: var(--color-text-secondary, #595959);
        --key: #243bf5;
        --amber: #745417;
        --needs-you: var(--amber);
        --issue: var(--amber);
        --findings: #7b00e8;
        --done: #25652f;
        --error: #a5293d;
        --error-mark: #a5293d;
        --sans: var(--font-sans, -apple-system, system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
        /* Surfaces are mixed from the host's colors, so they follow its theme. */
        --card: color-mix(in srgb, var(--text) 4.5%, var(--bg));
        --raised: color-mix(in srgb, var(--text) 9%, var(--bg));
        --selected: color-mix(in srgb, #4c9aff 20%, var(--card));
        /* A closed row's age, dimmer than --muted and still 4.5:1 on the card. */
        --age: color-mix(in srgb, var(--muted) 90%, var(--bg));
        --hover: color-mix(in srgb, var(--key) 14%, transparent);
        --soft: color-mix(in oklab, var(--text) 8%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 10%, transparent);
        /* A closed row under the pointer: half --soft, so a list swept by the pointer stays quiet. */
        --row-hover: color-mix(in oklab, var(--soft) 50%, transparent);
        /* The Codex app's --transition-duration-basic with ease. The tab's script sets --move and --enter. */
        --quick: 150ms ease;
        /* Where a row's mark sits, and where its text starts. */
        --mark-x: 18px;
        --text-x: 44px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: var(--color-background-primary, #171717);
          --text: var(--color-text-primary, #ececec);
          --muted: var(--color-text-secondary, #a8a8a8);
          --key: #b1b9f9;
          --amber: #ffc107;
          --findings: #cab0ff;
          --done: #7ecd8f;
          --error: #ffa3b0;
          --error-mark: #ff6b80;
          --card: color-mix(in srgb, var(--text) 5.5%, var(--bg));
          --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
          --selected: color-mix(in srgb, #7fa6d9 15%, var(--card));
          --age: color-mix(in srgb, var(--muted) 85%, var(--bg));
          --soft: color-mix(in oklab, var(--text) 12%, transparent);
          --soft-hover: color-mix(in oklab, var(--text) 14%, transparent);
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --key: #b1b9f9;
        --amber: #ffc107;
        --findings: #cab0ff;
        --done: #7ecd8f;
        --error: #ffa3b0;
        --error-mark: #ff6b80;
        --card: color-mix(in srgb, var(--text) 5.5%, var(--bg));
        --raised: color-mix(in srgb, var(--text) 11%, var(--bg));
        --selected: color-mix(in srgb, #7fa6d9 15%, var(--card));
        --age: color-mix(in srgb, var(--muted) 85%, var(--bg));
        --soft: color-mix(in oklab, var(--text) 12%, transparent);
        --soft-hover: color-mix(in oklab, var(--text) 14%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/20px var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
      }
      :focus-visible {
        outline: 1.5px solid var(--key);
        outline-offset: 1px;
        border-radius: 4px;
      }
      .muted {
        color: var(--muted);
      }
      .tone-needsYou {
        color: var(--needs-you);
      }
      .tone-issue {
        color: var(--issue);
      }
      .tone-findings {
        color: var(--findings);
      }
      .tone-done {
        color: var(--done);
      }
      .tone-error {
        color: var(--error);
      }
      .notice {
        padding: 10px 16px;
        color: var(--error);
        overflow-wrap: anywhere;
      }
      .notice .key {
        color: var(--text);
      }

      /* Tabs: the shown one a raised panel, the others text on the background. */
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        padding: 12px 12px 0;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tab {
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--muted);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.shown {
        background: var(--raised);
        color: var(--text);
        font-weight: 600;
      }
      .tab .count {
        font-weight: 600;
        margin-left: 6px;
      }
      .status {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }
      .status-line {
        flex-basis: 100%;
        padding: 0 4px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 12px 4px;
      }
      section {
        background: var(--card);
        border-radius: 8px;
        padding: 10px 0;
      }
      .group-title {
        padding: 0 14px 6px var(--mark-x);
        font-weight: 500;
      }
      .group-title .count {
        color: var(--muted);
        margin-left: 6px;
      }

      /* Rows. */
      .row {
        display: flex;
        padding: var(--row-pad) 14px var(--row-pad) var(--mark-x);
      }
      /* An open row keeps a closed row's padding, so its line does not move as it opens. */
      .row.selected {
        background-color: var(--selected);
      }
      /* A row that just appeared, in its tab's color. */
      .row.new {
        box-shadow: inset 3px 0 0 var(--bar);
      }
      .tone-bar-needsYou {
        --bar: var(--needs-you);
      }
      .tone-bar-findings {
        --bar: var(--findings);
      }
      /* Marks center in a badge's width, so a ?, a • and a number line up. */
      .mark {
        flex: none;
        width: calc(var(--text-x) - var(--mark-x));
        padding-right: 8px;
        text-align: center;
        color: var(--muted);
      }
      .mark.done {
        color: var(--done);
      }
      .mark.issue {
        color: var(--issue);
      }
      .mark.opportunity {
        color: var(--done);
      }
      .mark.error {
        color: var(--error-mark);
      }
      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Its space above is padding, not a gap, so the row's height grows smoothly when the panel mounts. Its 2px below,
         with the row's padding, matches the space from the row's top edge to its title's text. */
      .panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 0 2px;
      }
      .content > .tight,
      .content.tight {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .line {
        display: flex;
        width: 100%;
        min-width: 0;
      }
      .line .text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .line .text.two {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .line .after {
        flex: none;
        white-space: pre;
        color: var(--muted);
      }
      .row.collapsed .line .after:not(.tone-error),
      .row.collapsed .meta .age,
      .closed-list .age {
        color: var(--age);
      }
      .row.collapsed:hover .line .after:not(.tone-error),
      .row.collapsed:hover .meta .age {
        color: var(--muted);
      }
      .line .after.tone-error {
        color: var(--error);
      }
      /* Open, and while closing, the title shows in full where it stood, with the age following its last word. */
      .row.selected .line,
      .row.closing .line {
        display: block;
      }
      .row.selected .line .text,
      .row.closing .line .text {
        display: inline;
        white-space: normal;
      }
      .row.selected .line .after,
      .row.closing .line .after {
        white-space: normal;
      }
      .row.collapsed:hover {
        background-color: var(--row-hover);
      }
      /* After a click, rows slide under a pointer that has not moved, so nothing they bring under it lights up. */
      .still .row.collapsed:not(:active):hover {
        background-color: transparent;
      }
      .still .fold:not(:active):hover {
        color: var(--muted);
      }
      .title {
        font-weight: 600;
      }
      .title .after {
        font-weight: 400;
        color: var(--muted);
      }
      .body {
        overflow-wrap: anywhere;
      }
      .body p {
        margin: 0;
      }
      .body p + p {
        margin-top: 4px;
      }
      .file {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--soft);
        font-family: var(--mono);
      }
      /*
       * Actions are Codex's own pill buttons, size sm: the recommended option is solid, the row's other
       * answers are a soft gray fill, and the follow-ups are plain text. Keys are an extra, so no key text shows.
       */
      .keys {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 26px;
        padding: 3px 11px;
        border-radius: 999px;
        background: var(--soft);
        font-weight: 400;
        text-align: center;
        white-space: nowrap;
      }
      .key:not(:disabled):hover {
        background: var(--soft-hover);
      }
      .key:focus-visible {
        outline-width: 2px;
        outline-offset: 2px;
        border-radius: 999px;
      }
      .key.primary {
        background: var(--text);
        color: var(--bg);
      }
      .key.primary:not(:disabled):hover {
        background: color-mix(in srgb, var(--text) 82%, var(--bg));
      }
      .key .icon {
        flex: none;
        width: 14px;
        height: 14px;
      }
      /* A follow-up is plain text: muted, the text color under the pointer, with no fill and no padding. */
      .key.ghost {
        padding: 0;
        background: none;
        color: var(--muted);
      }
      .key.ghost:not(:disabled):hover {
        background: none;
        color: var(--text);
      }
      .keys.follow-ups {
        column-gap: 16px;
      }
      .key-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
      }
      .key-groups > .keys {
        min-width: 0;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      form {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      /* Codex's own fields: its border color, a 10px radius, and a heavier gray border on focus, not a colored ring. */
      input {
        flex: 1;
        min-width: 0;
        min-height: 28px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
        border-radius: 10px;
        padding: 4px 10px;
      }
      input::placeholder {
        color: var(--muted);
      }
      /* The radius again, since :focus-visible sets 4px. */
      input:focus,
      textarea:focus {
        outline: none;
        border-color: color-mix(in oklab, var(--text) 32%, transparent);
        border-radius: 10px;
      }
      textarea {
        width: 100%;
        font: 12px var(--mono);
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in oklab, var(--text) 15%, transparent);
        border-radius: 10px;
      }

      .empty-line {
        color: var(--muted);
      }
      .fold {
        display: block;
        margin: 8px 0 0 calc(var(--mark-x) - 2px);
        padding: 1px 4px;
        border-radius: 5px;
        color: var(--muted);
      }
      .fold:hover {
        color: var(--text);
      }
      .fold .icon {
        width: 12px;
        height: 12px;
        margin-right: 4px;
        vertical-align: -1px;
      }
      /* The closed items sit under the fold's label. */
      .closed-list {
        --mark-x: 34px;
        --text-x: 60px;
        padding-top: 4px;
      }
      .closed-list .row {
        padding-top: calc(var(--row-pad) / 2);
        padding-bottom: calc(var(--row-pad) / 2);
      }
      .outcome {
        font-weight: 600;
      }
      .outcome.lapsed {
        font-weight: 400;
        color: var(--muted);
      }
      .settled-head {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      /* A row that settles while open fades its fill out as its height shrinks over the panel. */
      .row.settled.was-open {
        transition: background-color var(--move);
        @starting-style {
          background-color: var(--selected);
        }
      }
      .settled-line {
        display: flex;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .settled-line.wraps {
        display: block;
        white-space: normal;
      }
      .settled .what {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .settled .outcome-label {
        flex: none;
        max-width: 50%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: pre;
        color: var(--muted);
      }
      .settled-line.wraps .outcome-label {
        white-space: normal;
      }
      /* Undo's fill is the time it has left. The pill keeps the line's height, so the row does not grow. */
      .key.undo {
        flex: none;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        margin: -3px 0 -3px 12px;
        background: color-mix(in oklab, var(--soft) 45%, transparent);
      }
      .time-left {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--soft);
        transform-origin: left;
        animation-name: empty;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      .key.undo:not(:disabled):hover .time-left {
        background: var(--soft-hover);
      }
      .time-left.paused {
        animation-play-state: paused;
      }
      @keyframes empty {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      /* The page is at least the pane's height. The footer sits at its bottom, and an empty tab's text fills the space above it. */
      #app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .empty .title {
        margin-bottom: 4px;
      }
      footer {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 16px;
        padding: 8px 16px 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .demo-toggle {
        padding: 0 6px;
        border-radius: 5px;
        color: var(--muted);
      }
      .demo-toggle:hover {
        color: var(--text);
        background: var(--hover);
      }
      .demo-note {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 12px;
        margin: 12px 12px 0;
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--raised);
        color: var(--text);
      }
      /*
       * Motion, with the Codex app's own timing, only for what enters or leaves. Hover, press and
       * selection fills change at once. What a draw mounts fades in from @starting-style, and heights
       * move in the script, around each draw. A row's own parts do not fade: a row that settles or is
       * undone swaps them in place, where a fade from nothing reads as a flicker.
       */
      /* The new-row bar fades out. */
      .row {
        transition: box-shadow var(--enter);
      }
      /* A panel does not fade: it stays opaque, clipped by its row's height, so a row closing and the row
         opening in its place move as one. */
      .status-line,
      .demo-note,
      .empty,
      main,
      form {
        transition: opacity var(--quick);
        @starting-style {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0s !important;
        }
        /* With no motion, Undo stays full and does not count down. */
        .time-left {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="notice muted">Loading…</div>
    <script>
      /*TAB_SCRIPT*/
    </script>
  </body>
</html>
